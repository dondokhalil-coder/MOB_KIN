<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOB_KIN - Communes et Quartiers de Kinshasa</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
        }

        /* 1. Body en Flexbox, sans padding pour laisser le footer toucher les bords */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        h1 {
            color: #007bff;
            margin-top: 20px;
        }

        p {
            margin-top: 5px;
        }

        /* 2. flex: 1 pousse le footer en bas | padding: 0 20px garde l'espace sur les côtés pour les cartes */
        #communes {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            padding: 0 20px;
            flex: 1;
        }

        .commune {
            background: white;
            width: 240px;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            align-self: flex-start;
        }

        .commune h3 {
            margin: 0 0 10px 0;
            color: #333;
        }

        .btn-quartiers {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.85em;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn-quartiers:hover {
            background-color: #0056b3;
        }

        .liste-quartiers {
            display: none;
            margin-top: 12px;
            text-align: left;
            width: 100%;
            background-color: #f9f9f9;
            padding: 10px;
            border-radius: 5px;
            box-sizing: border-box;
            max-height: 200px;
            overflow-y: auto;
        }

        .liste-quartiers ul {
            margin: 0;
            padding-left: 20px;
            font-size: 0.85em;
            color: #555;
        }

        .liste-quartiers.visible {
            display: block;
        }

        /* 3. Footer collé en bas ET allant d'un bord à l'autre */
        footer {
            background-color: #007bff;
            color: white;
            margin-top: 30px;
            font-size: 0.9em;
            padding: 15px 0;
            width: 100%;
        }

        a {
            color: #ffffff;
            text-decoration: none;
        }

        @media screen and (max-width: 600px) {
            .commune {
                width: 100%;
                max-width: 280px;
            }
        }
    </style>
</head>
<body>
    <h1>MOB_KIN <br> Communes et Quartiers de Kinshasa</h1>
    <p>Voici les 24 Communes de Kinshasa et leurs Quartiers.</p>
    
    <div id="communes"></div>

            "Makala": ["Bagota", "Bahumbu", "Bolima", "Kabila", "Kisantu", "Kwango", "Lemba-Village", "Mabulu"],
            "Maluku": ["Bu", "Dumi", "Kikimi", "Kimpoko", "Kingakati", "Kingono", "Kinzono", "Mai-Ndombe", "Maluku", "Mange-Ngenge", "Mbankana", "Menkao", "Monaco", "Mongata", "Mwe", "Ngama", "Nguma", "Yo", "Yoso"],

            "Selembao": ["Badiadingi", "Cité-Verte", "Herady", "Inga", "Kalunga", "Kingu", "Konde", "Kombé", "Libération", "Lubudi", "Madiata", "Mbola", "Molende", "Muana", "Ndobé", "Ngafani", "Nkulu", "Ntunu", "Pululu Mbambu"]
        };

        const conteneur = document.getElementById("communes");

        Object.keys(donneeKinshasa).forEach(function(commune) {
            const quartiers = donneeKinshasa[commune];

            const carte = document.createElement("div");
            carte.className = "commune";

            let listeHTML = "<ul>";
            quartiers.forEach(function(quartier) {
                listeHTML += `<li>${quartier}</li>`;
            });
            listeHTML += "</ul>";

            carte.innerHTML = `
                <div>
                    <h3>${commune}</h3>
                    <button class="btn-quartiers">Voir quartiers (${quartiers.length})</button>
                    <div class="liste-quartiers">
                        ${listeHTML}
                    </div>
                </div>
            `;

            const bouton = carte.querySelector(".btn-quartiers");
            const zoneQuartiers = carte.querySelector(".liste-quartiers");

            bouton.addEventListener("click", function() {
                zoneQuartiers.classList.toggle("visible");

                if (zoneQuartiers.classList.contains("visible")) {
                    bouton.textContent = "Masquer";
                } else {
                    bouton.textContent = `Voir quartiers (${quartiers.length})`;
                }
            });

            conteneur.appendChild(carte);
        });
    </script>
